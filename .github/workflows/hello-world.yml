name: Hello World

# Controls when the workflow will run
on:
  workflow_dispatch: 
#  schedule: 
#  - cron: "*/1 * * * *"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  hello-job:
    concurrency: 
        cancel-in-progress: true
        group: sss
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Echo text
        timeout-minutes: 1
        run: echo "hello, world!"